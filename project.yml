name: MB-tuner
options:
  createIntermediateGroups: true
  defaultConfig: Debug
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
packages:
  TunerKit:
    path: TunerKit

targets:
  MBTuner-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Apps/iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mbtuner.ios
        INFOPLIST_FILE: Apps/iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/iOS/GuitarTuner.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: TunerKit
        product: TunerCore
      - package: TunerKit
        product: TunerAudio
      - package: TunerKit
        product: TunerUI

  MBTuner-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Apps/macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mbtuner.macos
        INFOPLIST_FILE: Apps/macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/macOS/GuitarTuner.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: TunerKit
        product: TunerCore
      - package: TunerKit
        product: TunerAudio
      - package: TunerKit
        product: TunerUI

  MBTuner-watchOS:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Apps/watchOS
        excludes:
          - Complication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mbtuner.watch
        INFOPLIST_FILE: Apps/watchOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/watchOS/GuitarTuner.entitlements
        PRODUCT_NAME: MBTuner Watch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: TunerKit
        product: TunerCore
      - package: TunerKit
        product: TunerAudio
      - package: TunerKit
        product: TunerUI
      - target: MBTuner-watchOS-Complication
        embed: true

  MBTuner-watchOS-Complication:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Apps/watchOS/Complication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mbtuner.watch.complication
        INFOPLIST_FILE: Apps/watchOS/Info.plist
        SKIP_INSTALL: YES
        PRODUCT_NAME: MBTuner Complication
    dependencies: []

schemes:
  MBTuner-iOS:
    build:
      targets:
        MBTuner-iOS: all
    run:
      config: Debug
  MBTuner-macOS:
    build:
      targets:
        MBTuner-macOS: all
    run:
      config: Debug
  MBTuner-watchOS:
    build:
      targets:
        MBTuner-watchOS: all
        MBTuner-watchOS-Complication: all
    run:
      config: Debug
